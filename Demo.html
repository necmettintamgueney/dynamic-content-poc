<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pipeline Demo — Dynamic Content</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/dh-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF7;
    --surface: #FFFFFF;
    --surface-2: #F4F4EF;
    --surface-3: #ECECE5;
    --ink: #1B1F2A;
    --ink-soft: #4A5260;
    --ink-mute: #6B7280;
    --ink-faint: #9BA0AB;
    --border: #E4E4DD;
    --border-strong: #CFCFC6;
    --dh-red: #D61F26;
    --red-tint: #FCE8E9;
    --red-edge: #F2C9CB;
    --green: #00A86B;
    --green-2: #008C58;
    --green-tint: #E4F6EC;
    --green-edge: #BFE5CF;
    --amber: #C8870D;
    --amber-tint: #FBF0D6;
    --amber-edge: #ECCF93;
    --blue: #0066B3;
    --blue-2: #004F8C;
    --blue-tint: #E1EEF7;
    --blue-edge: #B7D6EC;
    --purple: #7B3FA0;
    --purple-tint: #F1E7F8;
    --t-lite: #6B7280;       --t-lite-tint: #EEEEF1;
    --t-pro:  #0066B3;       --t-pro-tint:  #E1EEF7;
    --t-plus: #7B3FA0;       --t-plus-tint: #F1E7F8;
    --t-ent:  #B07005;       --t-ent-tint:  #FBF0D6;
    --font: "Outfit", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --radius-xl: 22px;
    --shadow-1: 0 1px 2px rgba(20,22,30,0.04), 0 1px 1px rgba(20,22,30,0.03);
    --shadow-2: 0 4px 14px -6px rgba(20,22,30,0.10), 0 2px 4px rgba(20,22,30,0.04);
    --shadow-3: 0 12px 32px -12px rgba(20,22,30,0.16);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body { font-feature-settings: "ss01", "ss02", "cv11"; }
  .eyebrow { font-family: var(--font); font-weight: 600; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); }
  .mono { font-family: var(--mono); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulseDot { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.3); opacity: 1; } }
  @keyframes drawTick { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }
  @keyframes scanLine { 0% { transform: translateY(-10%); } 100% { transform: translateY(110%); } }
  @keyframes drift { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  @keyframes typeIn { from { width: 0; } to { width: 100%; } }
  @keyframes spinSlow { to { transform: rotate(360deg); } }
  @keyframes flowRight { 0% { transform: translateX(-12px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateX(220px); opacity: 0; } }

  /* Section enter — handled via .is-active toggle from IntersectionObserver in JS */
  .scene { opacity: 0.55; transition: opacity 500ms ease; }
  .scene.is-active { opacity: 1; }
  .scene .scene-inner { transform: translateY(8px); transition: transform 500ms ease; }
  .scene.is-active .scene-inner { transform: translateY(0); }

  /* Scroll progress bar */
  .progress-track {
    position: fixed; left: 0; right: 0; top: 0; height: 3px; z-index: 60;
    background: transparent;
    pointer-events: none;
  }
  .progress-fill {
    height: 100%; width: 0;
    background: var(--dh-red);
    transition: width 80ms linear;
  }

  /* Scene side rail */
  .rail {
    position: fixed; left: 18px; top: 50%; transform: translateY(-50%);
    z-index: 40; display: flex; flex-direction: column; gap: 6px;
  }
  .rail a {
    display: flex; align-items: center; gap: 8px;
    text-decoration: none; color: var(--ink-mute);
    padding: 4px 6px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
    transition: color 140ms ease;
  }
  .rail a:hover { color: var(--ink); }
  .rail .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--border-strong);
    transition: background 200ms ease, transform 200ms ease;
  }
  .rail a.active { color: var(--ink); }
  .rail a.active .dot { background: var(--dh-red); transform: scale(1.4); }
  .rail .label { opacity: 0; transform: translateX(-4px); transition: opacity 140ms ease, transform 140ms ease; max-width: 0; overflow: hidden; white-space: nowrap; }
  .rail a:hover .label, .rail a.active .label { opacity: 1; transform: translateX(0); max-width: 200px; }

  .fade-up { animation: fadeUp 500ms ease both; }

  @media (max-width: 1200px) { .rail { display: none; } }
</style>
</head>
<body>
<div class="progress-track"><div class="progress-fill" id="scroll-progress"></div></div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script>
  // Scroll progress (vanilla, runs immediately)
  (function() {
    const fill = document.getElementById("scroll-progress");
    function tick() {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      const p = max > 0 ? (h.scrollTop / max) : 0;
      fill.style.width = (p * 100) + "%";
    }
    window.addEventListener("scroll", tick, { passive: true });
    tick();
  })();
</script>

<script type="text/babel" src="dc-brand.jsx"></script>
<script type="text/babel" src="dc-scene-shell.jsx"></script>
<script type="text/babel" src="dc-scenes-a.jsx"></script>
<script type="text/babel" src="dc-scenes-b.jsx"></script>
<script type="text/babel" src="dc-demo-app.jsx"></script>
</body>
</html>
