<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dynamic Content — Delivery Hero</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/dh-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF7;
    --surface: #FFFFFF;
    --surface-2: #F4F4EF;
    --surface-3: #ECECE5;
    --ink: #1B1F2A;
    --ink-soft: #4A5260;
    --ink-mute: #6B7280;
    --ink-faint: #9BA0AB;
    --border: #E4E4DD;
    --border-strong: #CFCFC6;
    --dh-red: #D61F26;
    --red-tint: #FCE8E9;
    --red-edge: #F2C9CB;
    --green: #00A86B;
    --green-2: #008C58;
    --green-tint: #E4F6EC;
    --green-edge: #BFE5CF;
    --amber: #C8870D;
    --amber-tint: #FBF0D6;
    --amber-edge: #ECCF93;
    --blue: #0066B3;
    --blue-2: #004F8C;
    --blue-tint: #E1EEF7;
    --blue-edge: #B7D6EC;
    --purple: #7B3FA0;
    --purple-tint: #F1E7F8;
    --font: "Outfit", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --radius-xl: 22px;
    --shadow-1: 0 1px 2px rgba(20,22,30,0.04), 0 1px 1px rgba(20,22,30,0.03);
    --shadow-2: 0 4px 14px -6px rgba(20,22,30,0.10), 0 2px 4px rgba(20,22,30,0.04);
    --shadow-3: 0 12px 32px -12px rgba(20,22,30,0.16);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  body {
    font-feature-settings: "ss01", "ss02", "cv11";
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(214,31,38,0.05), transparent 60%),
      var(--bg);
  }
  .eyebrow {
    font-family: var(--font); font-weight: 600; font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-mute);
  }
  .mono { font-family: var(--mono); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes drift {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
  .fade-up { animation: fadeUp 520ms cubic-bezier(0.2,0.7,0.2,1) both; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="dc-brand.jsx"></script>
<script type="text/babel">
const TEAM = [
  { name: "Necmettin Tamgüney", role: "Product Lead",          tint: "var(--red-tint)",    edge: "var(--red-edge)",    accent: "var(--dh-red)" },
  { name: "Sarvesh Patil",       role: "Engineering Lead",     tint: "var(--blue-tint)",    edge: "var(--blue-edge)",    accent: "var(--blue)" },
  { name: "Ameer Hamza",         role: "Senior ML Engineer",   tint: "var(--purple-tint)",  edge: "#D9C2E8",             accent: "var(--purple)" },
  { name: "Bhavya Jain",         role: "Senior Data Scientist", tint: "var(--amber-tint)",  edge: "var(--amber-edge)",   accent: "var(--amber)" },
  { name: "Gabriel Straub",      role: "Senior Backend Engineer", tint: "var(--green-tint)", edge: "var(--green-edge)",  accent: "var(--green-2)" },
  { name: "Amit Sharma",         role: "Senior Backend Engineer", tint: "var(--blue-tint)",  edge: "var(--blue-edge)",   accent: "var(--blue)" },
  { name: "Nikhil Kulkarni",     role: "Backend Engineer",     tint: "var(--surface-2)",    edge: "var(--border-strong)", accent: "var(--ink-soft)" },
  { name: "Prashanth M",         role: "Backend Engineer",     tint: "var(--red-tint)",    edge: "var(--red-edge)",    accent: "var(--dh-red)" },
];

function initialsOf(name) {
  return name.split(/\s+/).slice(0, 2).map(w => w[0]).join("").toUpperCase();
}

function Avatar({ name, tint, edge, accent, size = 96 }) {
  // Circular avatar with brand-tinted gradient bg + initials.
  return (
    <div style={{
      width: size, height: size, borderRadius: "50%",
      background: `radial-gradient(ellipse at 30% 30%, var(--surface) 0%, ${tint} 70%)`,
      border: `1px solid ${edge}`,
      display: "flex", alignItems: "center", justifyContent: "center",
      position: "relative", overflow: "hidden",
      boxShadow: "var(--shadow-1)",
    }}>
      <span style={{
        fontFamily: "var(--font)", fontWeight: 700,
        fontSize: size * 0.32, color: accent,
        letterSpacing: "-0.02em",
      }}>{initialsOf(name)}</span>
      {/* subtle ring */}
      <div style={{
        position: "absolute", inset: 4,
        borderRadius: "50%", border: `1px dashed ${edge}`, opacity: 0.5,
      }}/>
    </div>
  );
}

function Hero() {
  return (
    <section style={{
      padding: "92px 28px 72px",
      maxWidth: 1200, margin: "0 auto",
      textAlign: "center",
    }}>
      <div className="fade-up" style={{ display: "inline-flex", alignItems: "center", gap: 8, padding: "6px 14px", border: "1px solid var(--border)", background: "var(--surface)", borderRadius: 999, boxShadow: "var(--shadow-1)", marginBottom: 28 }}>
        <span style={{ width: 8, height: 8, background: "var(--green)", borderRadius: "50%", animation: "drift 1.8s ease-in-out infinite" }}/>
        <span style={{ fontSize: 12.5, color: "var(--ink-soft)", fontWeight: 500 }}>Internal · Delivery Hero · Q-Commerce</span>
      </div>

      <div className="fade-up" style={{ display: "flex", justifyContent: "center", marginBottom: 14, animationDelay: "60ms" }}>
        <DCMark size={88}/>
      </div>

      <h1 className="fade-up" style={{
        margin: 0, fontFamily: "var(--font)", fontWeight: 800,
        fontSize: "clamp(56px, 8vw, 104px)", lineHeight: 1.0,
        letterSpacing: "-0.04em", color: "var(--ink)", textWrap: "balance",
        animationDelay: "120ms",
      }}>
        Dynamic <span style={{ color: "var(--dh-red)" }}>Content</span>
      </h1>

      <p className="fade-up" style={{
        marginTop: 22, fontSize: 22, lineHeight: 1.45,
        color: "var(--ink-soft)", maxWidth: 720,
        marginLeft: "auto", marginRight: "auto", fontWeight: 400,
        textWrap: "pretty",
        animationDelay: "180ms",
      }}>
        Closed-loop content intelligence for Q-Commerce. One Model Store, one QA framework, one feedback signal — applied to every title, attribute, and category we generate.
      </p>

      <div className="fade-up" style={{ marginTop: 36, display: "flex", justifyContent: "center", gap: 12, flexWrap: "wrap", animationDelay: "240ms" }}>
        <a href="Walkthrough.html" style={ctaPrimary}>
          View Strategy
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </a>
        <a href="Demo.html" style={ctaSecondary}>
          Watch Demo
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        </a>
      </div>

      <div className="fade-up" style={{ marginTop: 56, display: "inline-flex", flexWrap: "wrap", gap: 28, justifyContent: "center", animationDelay: "320ms" }}>
        {[
          { v: "2", l: "AI systems unified" },
          { v: "10", l: "problems closed out" },
          { v: "4", l: "investment tiers" },
          { v: "3", l: "platforms · 70+ countries" },
        ].map((s, i) => (
          <div key={i} style={{ textAlign: "left", padding: "4px 14px", borderLeft: i === 0 ? "none" : "1px solid var(--border)" }}>
            <div style={{ fontWeight: 700, fontSize: 28, color: "var(--ink)", letterSpacing: "-0.02em" }}>{s.v}</div>
            <div style={{ fontSize: 12, color: "var(--ink-mute)", marginTop: 2 }}>{s.l}</div>
          </div>
        ))}
      </div>
    </section>
  );
}

const ctaPrimary = {
  display: "inline-flex", alignItems: "center", gap: 8,
  padding: "13px 22px",
  background: "var(--ink)", color: "#fff",
  border: "1px solid var(--ink)",
  borderRadius: 999,
  fontFamily: "var(--font)", fontWeight: 600, fontSize: 15,
  textDecoration: "none",
  boxShadow: "var(--shadow-2)",
  transition: "transform 140ms ease, box-shadow 140ms ease",
};
const ctaSecondary = {
  ...ctaPrimary,
  background: "var(--surface)", color: "var(--ink)",
  border: "1px solid var(--border-strong)",
  boxShadow: "var(--shadow-1)",
};

function FeatureCards() {
  const cards = [
    {
      eyebrow: "Strategy",
      title: "The walkthrough",
      desc: "Executive narrative: ten problems across two AI systems, the architectural shift that resolves them, every loose thread closed on screen.",
      href: "Walkthrough.html",
      cta: "Read the strategy →",
      accent: "var(--dh-red)",
    },
    {
      eyebrow: "Demo",
      title: "Pipeline in motion",
      desc: "A product enters as a messy vendor upload and leaves as an enriched, categorized listing. Ten scenes, scroll-driven, end to end.",
      href: "Demo.html",
      cta: "Watch the pipeline →",
      accent: "var(--green-2)",
    },
  ];
  return (
    <section style={{ padding: "0 28px 88px", maxWidth: 1100, margin: "0 auto" }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
        {cards.map((c, i) => (
          <a key={i} href={c.href} style={{
            display: "block",
            background: "var(--surface)",
            border: "1px solid var(--border)",
            borderTop: `3px solid ${c.accent}`,
            borderRadius: "var(--radius-lg)",
            padding: 26,
            textDecoration: "none",
            color: "var(--ink)",
            boxShadow: "var(--shadow-1)",
            transition: "transform 180ms ease, box-shadow 180ms ease",
          }}
          onMouseEnter={(e) => { e.currentTarget.style.transform = "translateY(-2px)"; e.currentTarget.style.boxShadow = "var(--shadow-2)"; }}
          onMouseLeave={(e) => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "var(--shadow-1)"; }}
          >
            <div className="eyebrow" style={{ color: c.accent }}>{c.eyebrow}</div>
            <div style={{ marginTop: 10, fontSize: 26, fontWeight: 700, letterSpacing: "-0.015em" }}>{c.title}</div>
            <div style={{ marginTop: 10, fontSize: 15, color: "var(--ink-soft)", lineHeight: 1.55 }}>{c.desc}</div>
            <div style={{ marginTop: 18, fontSize: 14, fontWeight: 600, color: c.accent }}>{c.cta}</div>
          </a>
        ))}
      </div>
    </section>
  );
}

function Team() {
  return (
    <section style={{ padding: "0 28px 120px", maxWidth: 1200, margin: "0 auto" }}>
      <div style={{ marginBottom: 40, textAlign: "center" }}>
        <div className="eyebrow">Behind the work</div>
        <h2 style={{ margin: "10px 0 0", fontSize: 44, fontWeight: 700, letterSpacing: "-0.025em", color: "var(--ink)" }}>Our team</h2>
        <p style={{ marginTop: 10, fontSize: 16, color: "var(--ink-mute)", maxWidth: 540, marginLeft: "auto", marginRight: "auto" }}>
          The product, engineering, and ML group building Dynamic Content for Delivery Hero.
        </p>
      </div>

      <div style={{
        display: "grid",
        gridTemplateColumns: "repeat(auto-fill, minmax(220px, 1fr))",
        gap: 14,
      }}>
        {TEAM.map((m, i) => (
          <div key={m.name} className="fade-up" style={{
            padding: 22,
            background: "var(--surface)",
            border: "1px solid var(--border)",
            borderRadius: "var(--radius-lg)",
            display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center",
            animationDelay: `${i * 50}ms`,
            boxShadow: "var(--shadow-1)",
          }}>
            <Avatar name={m.name} tint={m.tint} edge={m.edge} accent={m.accent} size={84}/>
            <div style={{ marginTop: 14, fontSize: 15, fontWeight: 600, color: "var(--ink)", letterSpacing: "-0.005em" }}>{m.name}</div>
            <div style={{ marginTop: 4, fontSize: 12.5, color: "var(--ink-mute)" }}>{m.role}</div>
          </div>
        ))}
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer style={{
      padding: "32px 28px 48px",
      borderTop: "1px solid var(--border)",
      background: "var(--surface)",
    }}>
      <div style={{
        maxWidth: 1280, margin: "0 auto",
        display: "flex", flexWrap: "wrap", justifyContent: "space-between", gap: 14, alignItems: "center",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <DCLockup size={22} fontSize={14}/>
          <span style={{ width: 1, height: 16, background: "var(--border)" }}/>
          <DHBadge/>
        </div>
        <div style={{ fontSize: 12, color: "var(--ink-mute)" }}>
          Internal preview · not for external distribution
        </div>
      </div>
    </footer>
  );
}

function App() {
  return (
    <div>
      <TopNav active="home"/>
      <Hero/>
      <FeatureCards/>
      <Team/>
      <Footer/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
